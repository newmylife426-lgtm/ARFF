<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Pink Dino Runner 🦖💗</title>
    <!-- 1. ดึง A-Frame และ AR.js Libraries มาใช้งาน -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Kanit', Arial, sans-serif;
        }

        /* UI Control Panel ลอยอยู่บนหน้าจอ AR */
        #ui-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid #FF69B4;
            z-index: 9999;
            text-align: center;
            width: 280px;
        }

        h3 {
            margin: 0 0 8px 0;
            color: #D81B60;
            font-size: 18px;
        }

        .speed-label {
            font-size: 14px;
            color: #880E4F;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .speed-value {
            color: #FF1493;
            font-weight: bold;
            font-size: 16px;
        }

        input[type=range] {
            width: 100%;
            margin: 8px 0 12px 0;
            accent-color: #FF1493;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn {
            background: #FF69B4;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #FF1493;
            transform: scale(1.05);
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- 🎛️ UI สำหรับปรับความเร็ว -->
    <div id="ui-container">
        <h3>🦖 Pink Dino Runner</h3>
        <div class="speed-label">ความเร็วการวิ่ง: <span id="speed-display" class="speed-value">5</span></div>
        
        <!-- Slider ปรับความเร็ว -->
        <input type="range" id="speed-slider" min="1" max="25" value="5" oninput="updateSpeed(this.value)">
        
        <!-- ปุ่ม Preset ความเร็ว -->
        <div class="btn-group">
            <button class="btn" onclick="setPresetSpeed(2)">🐢 ช้า</button>
            <button class="btn" onclick="setPresetSpeed(5)">🚶 ปกติ</button>
            <button class="btn" onclick="setPresetSpeed(12)">🏃 เร็ว</button>
            <button class="btn" onclick="setPresetSpeed(22)">⚡ เร็วแรง!</button>
        </div>
    </div>

    <script>
        // ตัวแปรเก็บความเร็วการวิ่งแบบ Global
        window.dinoSpeed = 5;

        function updateSpeed(val) {
            window.dinoSpeed = parseFloat(val);
            document.getElementById('speed-display').innerText = val;
        }

        function setPresetSpeed(val) {
            document.getElementById('speed-slider').value = val;
            updateSpeed(val);
        }

        // 🧠 สร้าง Component การเคลื่อนไหวของไดโนเสาร์ด้วย A-Frame JS
        AFRAME.registerComponent('dino-runner', {
            init: function () {
                this.leftLeg = this.el.querySelector('#left-leg');
                this.rightLeg = this.el.querySelector('#right-leg');
                this.leftArm = this.el.querySelector('#left-arm');
                this.rightArm = this.el.querySelector('#right-arm');
                this.bodyGroup = this.el.querySelector('#body-group');
                this.time = 0;
            },
            tick: function (t, dt) {
                if (!dt) return;

                let speed = window.dinoSpeed;
                this.time += (dt / 1000) * speed;

                // 1. แกว่งขาขวากับขาซ้ายสลับกัน
                let legAngle = Math.sin(this.time * 3) * 35;
                if (this.leftLeg) this.leftLeg.setAttribute('rotation', `${legAngle} 0 0`);
                if (this.rightLeg) this.rightLeg.setAttribute('rotation', `${-legAngle} 0 0`);

                // 2. แกว่งแขนสลับทิศทางกับขา
                let armAngle = Math.sin(this.time * 3) * 25;
                if (this.leftArm) this.leftArm.setAttribute('rotation', `${-armAngle} 0 0`);
                if (this.rightArm) this.rightArm.setAttribute('rotation', `${armAngle} 0 0`);

                // 3. จังหวะตัวเด้งขึ้นลงตามจังหวะก้าววิ่ง
                let bounce = Math.abs(Math.sin(this.time * 6)) * 0.12;
                if (this.bodyGroup) {
                    this.bodyGroup.setAttribute('position', `0 ${bounce} 0`);
                }
            }
        });
    </script>

    <!-- 🎥 AR Scene Setup -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- 🎯 Hiro Marker Anchor -->
        <a-marker preset="hiro">
            
            <!-- 🦖 ไดโนเสาร์สีชมพู (เพิ่ม rotation="0 90 0" เพื่อหมุนหันข้าง) -->
            <a-entity id="pink-dino" position="0 0 0" rotation="0 90 0" scale="0.6 0.6 0.6" dino-runner>
                
                <!-- กลุ่มลำตัวเด้งตามการวิ่ง (Body Group) -->
                <a-entity id="body-group">
                    
                    <!-- ลำตัว (Body) -->
                    <a-box position="0 0.8 0" width="0.7" height="0.9" depth="0.8" color="#FF69B4"></a-box>
                    <!-- หน้าท้องสีชมพูอ่อน (Belly) -->
                    <a-box position="0 0.75 0.1" width="0.6" height="0.7" depth="0.65" color="#FFB6C1"></a-box>

                    <!-- หัว (Head) -->
                    <a-box position="0 1.5 0.2" width="0.65" height="0.6" depth="0.7" color="#FF69B4"></a-box>
                    <!-- ปาก (Snout) -->
                    <a-box position="0 1.4 0.6" width="0.6" height="0.4" depth="0.5" color="#FF69B4"></a-box>
                    <a-box position="0 1.25 0.6" width="0.58" height="0.08" depth="0.48" color="#FF1493"></a-box>

                    <!-- ตาซ้าย & ขวา (Eyes) -->
                    <a-sphere position="-0.34 1.6 0.4" radius="0.1" color="#FFFFFF"></a-sphere>
                    <a-sphere position="-0.37 1.6 0.43" radius="0.05" color="#000000"></a-sphere>
                    <a-sphere position="0.34 1.6 0.4" radius="0.1" color="#FFFFFF"></a-sphere>
                    <a-sphere position="0.37 1.6 0.43" radius="0.05" color="#000000"></a-sphere>

                    <!-- แก้มอมชมพู (Cute Cheeks) -->
                    <a-sphere position="-0.34 1.4 0.45" radius="0.08" color="#FF1493" opacity="0.7"></a-sphere>
                    <a-sphere position="0.34 1.4 0.45" radius="0.08" color="#FF1493" opacity="0.7"></a-sphere>

                    <!-- หนามหลัง (Back Spikes) -->
                    <a-cone position="0 1.7 -0.15" radius-bottom="0.1" radius-top="0" height="0.2" color="#FF1493" rotation="20 0 0"></a-cone>
                    <a-cone position="0 1.3 -0.35" radius-bottom="0.12" radius-top="0" height="0.25" color="#FF1493" rotation="25 0 0"></a-cone>
                    <a-cone position="0 0.9 -0.4" radius-bottom="0.12" radius-top="0" height="0.25" color="#FF1493" rotation="30 0 0"></a-cone>

                    <!-- หาง (Tail) -->
                    <a-cone position="0 0.5 -0.7" radius-bottom="0.25" radius-top="0.05" height="0.8" color="#FF69B4" rotation="-50 0 0"></a-cone>

                    <!-- แขนซ้าย (Left Arm) -->
                    <a-entity id="left-arm" position="-0.4 1.0 0.2">
                        <a-box position="0 -0.15 0.1" width="0.12" height="0.3" depth="0.12" color="#FF1493" rotation="-20 0 0"></a-box>
                    </a-entity>

                    <!-- แขนขวา (Right Arm) -->
                    <a-entity id="right-arm" position="0.4 1.0 0.2">
                        <a-box position="0 -0.15 0.1" width="0.12" height="0.3" depth="0.12" color="#FF1493" rotation="-20 0 0"></a-box>
                    </a-entity>

                </a-entity>

                <!-- 🦵 ขาซ้าย (Left Leg) -->
                <a-entity id="left-leg" position="-0.22 0.4 0">
                    <a-box position="0 -0.25 0" width="0.18" height="0.5" depth="0.22" color="#FF1493"></a-box>
                    <a-box position="0 -0.48 0.1" width="0.2" height="0.1" depth="0.35" color="#FF1493"></a-box>
                </a-entity>

                <!-- 🦵 ขาขวา (Right Leg) -->
                <a-entity id="right-leg" position="0.22 0.4 0">
                    <a-box position="0 -0.25 0" width="0.18" height="0.5" depth="0.22" color="#FF1493"></a-box>
                    <a-box position="0 -0.48 0.1" width="0.2" height="0.1" depth="0.35" color="#FF1493"></a-box>
                </a-entity>

            </a-entity>

        </a-marker>

        <!-- กล้องของ AR -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
