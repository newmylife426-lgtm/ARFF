<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR ควบคุมความเร็วการหมุน - โดยครู Code</title>
    
    <!-- 1. โหลด A-Frame สำหรับสร้าง 3D -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. โหลด AR.js สำหรับเชื่อมต่อกล้องและทำ AR -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* ตกแต่ง UI ปุ่มกดให้ซ้อนทับหน้ากล้อง AR */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; /* ให้อยู่หน้าสุด */
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 8px;
            transition: 0.2s;
        }
        
        button:hover { background-color: #218838; }
        button.btn-slow { background-color: #ffc107; color: black; }
        button.btn-slow:hover { background-color: #e0a800; }
        button.btn-fast { background-color: #dc3545; }
        button.btn-fast:hover { background-color: #c82333; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ส่วนที่ 1: ปุ่ม UI บนหน้าจอ -->
    <div class="ui-container">
        <button class="btn-slow" onclick="changeSpeed(10000)">ช้าลง (10 วิ/รอบ)</button>
        <button onclick="changeSpeed(5000)">ปกติ (5 วิ/รอบ)</button>
        <button class="btn-fast" onclick="changeSpeed(1500)">เร็วขึ้น (1.5 วิ/รอบ)</button>
    </div>

    <!-- ส่วนที่ 2: ฉาก AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- ใช้ Hiro Marker (มาร์กเกอร์มาตรฐาน) -->
        <a-marker preset="hiro">
            
            <!-- วัตถุกล่อง 3 มิติ -->
            <a-box
                id="myBox"
                position="0 0.5 0"
                material="color: #4CC3D9; transparent: true; opacity: 0.9;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            </a-box>
            
        </a-marker>

        <!-- กล้อง AR -->
        <a-entity camera></a-entity>
    </a-scene>

    <!-- ส่วนที่ 3: JavaScript สำหรับควบคุมความเร็ว -->
    <script>
        function changeSpeed(newDuration) {
            // ดึง Element กล่องจาก ID
            const box = document.getElementById('myBox');
            
            // อัปเดตความเร็ว โดยเปลี่ยนค่า dur (duration คือระยะเวลาต่อ 1 รอบ มีหน่วยเป็นมิลลิวินาที)
            // ค่าน้อย = เร็วขึ้น, ค่ามาก = ช้าลง
            box.setAttribute('animation', `property: rotation; to: 0 360 0; loop: true; dur: ${newDuration}; easing: linear;`);
            
            console.log("เปลี่ยนความเร็วเป็น: " + newDuration + " ms");
        }
    </script>
</body>
</html>
